name: test on FreeBSD

on:
  push:
    branches: [ "trunk", "develop" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:
    runs-on: freebsd-latest

    strategy:
      fail-fast: false

      matrix:
        os: [freebsd-latest]
        build_type: [Release]
        cpp_compiler: [c++]

    steps:
    - uses: https://data.forgejo.org/actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    # - name: Checkout libmcfp
    #   uses: https://data.forgejo.org/actions/checkout@v4
    #   with:
    #     repository: maarten/mcfp.git
    #     path: libmcfp

    # - name: Build & install libmcfp
    #   run: |
    #     cmake -B ${{github.workspace}}/libmcfp/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -S ${{github.workspace}}/libmcfp -DBUILD_DOCUMENTATION=OFF -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/installed
    #     cmake --build ${{github.workspace}}/libmcfp/build
    #     sudo cmake --install ${{github.workspace}}/libmcfp/build

    # - name: Checkout mrc
    #   uses: https://data.forgejo.org/actions/checkout@v4
    #   with:
    #     repository: maarten/mrc.git
    #     path: mrc

    # - name: Build & install mrc
    #   run: |
    #     cmake -B ${{github.workspace}}/mrc/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -S ${{github.workspace}}/mrc -DBUILD_DOCUMENTATION=OFF -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/installed
    #     cmake --build ${{github.workspace}}/mrc/build
    #     sudo cmake --install ${{github.workspace}}/mrc/build

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DCMAKE_PREFIX_PATH=${{github.workspace}}/installed
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} --rerun-failed --output-on-failure
